<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AR Repair Tutor</title>
    <style>
      /* ---- Theme tokens ------------------------------------------------------
         Light is the default (bare :root). Dark overrides only what changes,
         under [data-theme="dark"] set by main.js. We deliberately do NOT key off
         prefers-color-scheme — the product default is light regardless of OS. */
      :root {
        --bg: #e9ecf1;                       /* body + 3D scene backdrop */
        --panel: rgba(255, 255, 255, 0.82);  /* frosted panels / cards / fabs */
        --panel-solid: #ffffff;
        --border: #d3d8e0;
        --text: #1b1f27;
        --muted: #5c6472;
        --accent: #2fbfb3;        /* fills & focus rings (paired with --accent-ink) */
        --accent-ink: #06322d;    /* text/icon sitting on an --accent fill */
        --accent-text: #0c8379;   /* accent used as text on a panel (needs contrast) */
        --input-bg: #ffffff;
        --input-hover: #eef1f5;
        --danger: #e0524f;
        --shadow: 0 10px 40px rgba(20, 30, 50, 0.18);
      }
      :root[data-theme='dark'] {
        --bg: #14161c;
        --panel: rgba(26, 29, 38, 0.92);
        --panel-solid: #21252f;
        --border: #2a2e3a;
        --text: #e6e8ee;
        --muted: #9aa0ad;
        --accent: #4ecdc4;
        --accent-ink: #0b0d12;
        --accent-text: #4ecdc4;
        --input-bg: #21252f;
        --input-hover: #2a2f3b;
        --danger: #ff6b6b;
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        /* No CSS transition here: Chrome won't re-evaluate a var()-based
           background/color through a transition when the custom property flips,
           so the body would stick on the old theme. The swap is instant, matching
           the panels (which also flip instantly). */
      }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 300px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        backdrop-filter: blur(10px);
        box-shadow: var(--shadow);
        z-index: 15;
      }
      .panel h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: 0.2px; }
      .panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
      .panel .sub a { color: var(--accent-text); text-decoration: none; }

      .field { margin-bottom: 16px; }
      .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      select:hover { border-color: var(--accent); }
      .val { font-variant-numeric: tabular-nums; color: var(--accent-text); font-size: 12px; }

      .toggles { display: flex; flex-direction: column; gap: 9px; }
      .toggle { display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer; }
      .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

      button {
        width: 100%;
        margin-top: 4px;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--input-bg);
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: var(--input-hover); border-color: var(--accent); }

      hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

      /* ---- Advanced (developer) disclosure — collapsed by default ---- */
      .advanced { margin-top: 4px; border-top: 1px solid var(--border); padding-top: 12px; }
      .advanced > summary {
        list-style: none; cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 6px;
        font-size: 12px; color: var(--muted); padding: 4px 0; margin-bottom: 4px;
      }
      .advanced > summary::-webkit-details-marker { display: none; }
      .advanced > summary::before {
        content: '▸'; font-size: 10px; color: var(--accent-text);
        transition: transform 0.15s ease;
      }
      .advanced[open] > summary::before { transform: rotate(90deg); }
      .advanced > summary:hover { color: var(--text); }
      .advanced > .field:first-of-type { margin-top: 8px; }

      .stat { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
      .stat b { color: var(--accent-text); font-variant-numeric: tabular-nums; }

      .legend { margin-top: 10px; max-height: 220px; overflow-y: auto; }
      .legend-row {
        display: flex; align-items: center; gap: 9px;
        font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: default;
      }
      .legend-row:hover { background: var(--input-hover); }
      .swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid rgba(128,128,128,0.3); }

      /* ---- Mode bar (top-centre) ---- */
      .modebar {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; backdrop-filter: blur(10px);
        box-shadow: var(--shadow); z-index: 20; max-width: calc(100vw - 32px); overflow-x: auto;
      }
      .modebtn {
        width: auto; margin: 0; padding: 8px 12px; font-size: 13px;
        white-space: nowrap; border-radius: 9px; background: transparent;
        border: 1px solid transparent;
      }
      .modebtn.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

      /* ---- Bottom dock: stacks the card + fabs + captions so nothing overlaps.
         The dock itself is click-through (pointer-events:none); only its real
         children capture input, so you can still orbit the model in the gaps. */
      .dock {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        padding: 0 16px 16px;
        padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        pointer-events: none;
      }
      .dock > * { pointer-events: auto; }

      /* ---- Step / part-info / quiz card ---- */
      .card {
        width: min(560px, 100%);
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; padding: 16px 18px; backdrop-filter: blur(10px);
        box-shadow: var(--shadow); display: none;
      }
      .card.show { display: block; }
      .card .kicker { font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent-text); margin-bottom: 6px; }
      .card .body { font-size: 15px; line-height: 1.5; margin-bottom: 4px; }
      .card .meta { font-size: 12px; color: var(--muted); }
      .stepnav { display: flex; gap: 8px; margin-top: 14px; }
      .stepnav button { margin: 0; }
      .stepnav .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .chip {
        width: auto; margin: 0; padding: 7px 12px; font-size: 12px; border-radius: 999px;
        background: var(--input-bg); border: 1px solid var(--border);
      }
      .chip:hover { border-color: var(--accent); }

      /* ---- Floating action buttons (AR + mic), right-aligned above the card ---- */
      .fab-cluster {
        align-self: flex-end;
        display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
      }
      .fab {
        width: auto; margin: 0; display: inline-flex; align-items: center; gap: 8px;
        padding: 12px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
        border: 1px solid var(--border); background: var(--panel); color: var(--text);
        backdrop-filter: blur(10px); box-shadow: var(--shadow); cursor: pointer;
      }
      .fab.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
      .fab.mic.listening { background: var(--danger); color: #fff; border-color: var(--danger); animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,82,79,0.5); } 50% { box-shadow: 0 0 0 10px rgba(224,82,79,0); } }
      .fab:disabled { opacity: 0.4; cursor: not-allowed; }

      /* ---- Status pill + live voice caption (dock children, centred) ---- */
      .status {
        font-size: 12px; color: var(--muted);
        background: var(--panel); border: 1px solid var(--border);
        padding: 7px 14px; border-radius: 20px; transition: opacity 0.3s;
        backdrop-filter: blur(10px); text-align: center;
      }
      .voice-caption {
        max-width: min(560px, 100%); font-size: 13px; color: var(--text); text-align: center;
        background: var(--panel); border: 1px solid var(--border);
        padding: 8px 14px; border-radius: 12px; display: none; backdrop-filter: blur(10px);
      }
      .voice-caption.show { display: block; }
      .voice-caption b { color: var(--accent-text); }

      /* ---- Corner controls (independent of the dock) ---- */
      #exitAR {
        position: fixed; z-index: 40; display: none;
        top: calc(16px + env(safe-area-inset-top, 0px));
        left: calc(16px + env(safe-area-inset-left, 0px));
      }
      #panelToggle {
        position: fixed; top: 16px; left: 16px; z-index: 25; width: auto; margin: 0;
        padding: 9px 12px; border-radius: 10px; display: none;
        background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(10px);
      }
      .panel.collapsed { display: none; }

      #themeToggle {
        position: fixed; top: 16px; right: 16px; z-index: 25; width: auto; margin: 0;
        padding: 9px 12px; border-radius: 10px;
        background: var(--panel); border: 1px solid var(--border); box-shadow: var(--shadow); backdrop-filter: blur(10px);
      }

      /* ---- AR mode: hide the dev chrome, show exit ---- */
      body.ar-active .panel,
      body.ar-active #panelToggle,
      body.ar-active #themeToggle,
      body.ar-active .status,
      body.ar-active .fab.ar { display: none !important; }
      body.ar-active #exitAR { display: flex; }

      /* Modal backdrop behind the mobile controls sheet. Off on desktop. */
      #sheetBackdrop {
        position: fixed; inset: 0; z-index: 55; display: none;
        background: rgba(10, 14, 22, 0.45);
        opacity: 0; pointer-events: none; transition: opacity 0.28s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #sheetBackdrop.show { opacity: 1; pointer-events: auto; }

      /* ---- Mobile: phone-first re-layout --------------------------------
         The app's primary device is a phone (AR is Android-Chrome only), so
         the desktop dev panel becomes a thumb-reachable bottom SHEET and the
         tutor chrome (modes, voice, AR, steps) is foregrounded. Header icons
         (gear · theme) sit on their own line; the mode bar gets its own row
         below so nothing overlaps, and the notch/home-bar are respected. */
      @media (max-width: 720px) {
        /* Header line: gear (left) + theme (right), clear of the notch. */
        #panelToggle {
          display: block;
          top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px;
        }
        #themeToggle { top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; }

        /* Mode bar: full-width scroll row on its own line under the header. */
        .modebar {
          top: calc(56px + env(safe-area-inset-top, 0px));
          left: 12px; right: 12px; transform: none; max-width: none;
          gap: 6px; padding: 6px; scroll-snap-type: x proximity;
          -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .modebar::-webkit-scrollbar { display: none; }
        .modebtn {
          padding: 9px 13px; font-size: 13px; min-height: 42px; scroll-snap-align: start;
        }

        /* Dev controls become a bottom sheet: always mounted, slid off-screen,
           revealed by the gear. A grab handle + tappable backdrop dismiss it. */
        #sheetBackdrop { display: block; }
        .panel {
          display: block; top: auto; bottom: 0; left: 0; right: 0;
          width: 100%; max-width: none; max-height: 78vh; z-index: 60;
          border-radius: 20px 20px 0 0; padding: 10px 18px 20px;
          padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px));
          transform: translateY(100%);
          transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
        }
        .panel.open { transform: translateY(0); }
        .panel.collapsed { display: block; }   /* legacy class: don't hard-hide the sheet */
        .panel::before {                        /* grab handle, pinned while the sheet scrolls */
          content: ''; display: block; position: sticky; top: 0;
          width: 40px; height: 4px; margin: 2px auto 12px;
          border-radius: 999px; background: var(--border);
        }

        /* Keep a long step/quiz card from eating the viewport; scroll inside. */
        .card { max-height: 42vh; overflow-y: auto; }
        .fab { padding: 12px 16px; font-size: 14px; }
      }

      /* Landscape phones (how you actually hold a phone for AR): little
         vertical room, so trim the sheet and card and tighten the header. */
      @media (max-width: 900px) and (max-height: 500px) and (orientation: landscape) {
        .modebar { top: calc(48px + env(safe-area-inset-top, 0px)); }
        .panel { max-height: 88vh; }
        .card { max-height: 34vh; }
        .dock { gap: 6px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div id="sheetBackdrop"></div>

    <div class="panel">
      <h1>Exploded View</h1>
      <div class="sub" id="credit">…</div>

      <!-- Primary, end-user controls: choose an object, spread it, look around. -->
      <div class="field">
        <label>Model</label>
        <select id="model"></select>
      </div>

      <div class="field">
        <label>Explode amount</label>
        <div class="row">
          <input type="range" id="explode" min="0" max="2" step="0.01" value="0" />
        </div>
        <div class="row"><span class="val" id="explodeVal">0.00</span></div>
      </div>

      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="autorotate" /> Auto-rotate</label>
      </div>

      <button id="reset">Reset view</button>

      <!-- Developer tools, collapsed by default on every device. Native
           <details> so it needs no JS; the ids stay identical so main.js
           wiring is unchanged wherever these controls live in the DOM. -->
      <details class="advanced">
        <summary>Advanced</summary>

        <div class="field">
          <label>Split mode</label>
          <select id="mode">
            <option value="group">By material group</option>
            <option value="component">By connected piece</option>
          </select>
        </div>

        <div class="toggles">
          <label class="toggle"><input type="checkbox" id="tint" /> Tint parts by component</label>
          <label class="toggle"><input type="checkbox" id="wireframe" /> Wireframe</label>
        </div>

        <hr />

        <div class="stat"><span>Component parts</span><b id="partCount">–</b></div>
        <div class="legend" id="legend"></div>
      </details>
    </div>

    <div class="modebar" id="modebar"></div>

    <!-- Bottom dock: voice caption → fabs → card → status, stacked so they never
         collide on narrow screens. -->
    <div class="dock">
      <div class="voice-caption" id="voiceCaption"></div>

      <div class="fab-cluster">
        <button class="fab ar primary" id="startAR">📱 View in AR</button>
        <button class="fab mic" id="micBtn">🎤 Ask</button>
      </div>

      <div class="card" id="card">
        <div class="kicker" id="cardKicker">Fix</div>
        <div class="body" id="cardBody">…</div>
        <div class="meta" id="cardMeta"></div>
        <div class="chips" id="cardChips"></div>
        <div class="stepnav" id="cardNav">
          <button id="stepPrev">◀ Back</button>
          <button id="stepNext" class="primary">Next ▶</button>
        </div>
      </div>

      <div class="status" id="status">Initialising…</div>
    </div>

    <button id="panelToggle">⚙︎ Controls</button>
    <button id="themeToggle" title="Toggle light / dark theme">🌙 Dark</button>

    <button class="fab" id="exitAR">✕ Exit AR</button>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
