<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Repair Tutor</title>
    <style>
      :root {
        --bg: #14161c;
        --panel: rgba(26, 29, 38, 0.92);
        --border: #2a2e3a;
        --text: #e6e8ee;
        --muted: #9aa0ad;
        --accent: #4ecdc4;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      #view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }

      .panel {
        position: fixed;
        top: 16px;
        left: 16px;
        width: 300px;
        max-height: calc(100vh - 32px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 18px;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }
      .panel h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: 0.2px; }
      .panel .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
      .panel .sub a { color: var(--accent); text-decoration: none; }

      .field { margin-bottom: 16px; }
      .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 7px; }
      .row { display: flex; align-items: center; justify-content: space-between; }
      input[type='range'] { width: 100%; accent-color: var(--accent); }
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #21252f;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      select:hover { border-color: var(--accent); }
      .val { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 12px; }

      .toggles { display: flex; flex-direction: column; gap: 9px; }
      .toggle { display: flex; align-items: center; gap: 9px; font-size: 13px; cursor: pointer; }
      .toggle input { accent-color: var(--accent); width: 15px; height: 15px; }

      button {
        width: 100%;
        margin-top: 4px;
        padding: 9px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: #21252f;
        color: var(--text);
        font-size: 13px;
        cursor: pointer;
      }
      button:hover { background: #2a2f3b; border-color: var(--accent); }

      hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }

      .stat { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
      .stat b { color: var(--accent); font-variant-numeric: tabular-nums; }

      .legend { margin-top: 10px; max-height: 220px; overflow-y: auto; }
      .legend-row {
        display: flex; align-items: center; gap: 9px;
        font-size: 12px; padding: 4px 6px; border-radius: 6px; cursor: default;
      }
      .legend-row:hover { background: #252a35; }
      .swatch { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,0.15); }

      .status {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        font-size: 12px; color: var(--muted);
        background: var(--panel); border: 1px solid var(--border);
        padding: 7px 14px; border-radius: 20px;
        transition: opacity 0.3s;
      }

      /* ---- Mode bar (top-centre) ---- */
      .modebar {
        position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
        display: flex; gap: 6px; padding: 6px;
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.4); z-index: 20;
      }
      .modebtn {
        width: auto; margin: 0; padding: 8px 12px; font-size: 13px;
        white-space: nowrap; border-radius: 9px; background: transparent;
        border: 1px solid transparent;
      }
      .modebtn.active { background: var(--accent); color: #0b0d12; border-color: var(--accent); font-weight: 600; }

      /* ---- Bottom card: steps / part info / quiz ---- */
      .card {
        position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%);
        width: min(560px, calc(100vw - 32px));
        background: var(--panel); border: 1px solid var(--border);
        border-radius: 14px; padding: 16px 18px; backdrop-filter: blur(10px);
        box-shadow: 0 10px 40px rgba(0,0,0,0.4); z-index: 20; display: none;
      }
      .card.show { display: block; }
      .card .kicker { font-size: 11px; letter-spacing: 0.6px; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
      .card .body { font-size: 15px; line-height: 1.5; margin-bottom: 4px; }
      .card .meta { font-size: 12px; color: var(--muted); }
      .stepnav { display: flex; gap: 8px; margin-top: 14px; }
      .stepnav button { margin: 0; }
      .stepnav .primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .chip {
        width: auto; margin: 0; padding: 7px 12px; font-size: 12px; border-radius: 999px;
        background: #21252f; border: 1px solid var(--border);
      }
      .chip:hover { border-color: var(--accent); }

      /* ---- Floating action buttons (AR + mic) ---- */
      .fab-cluster {
        position: fixed; right: 16px; bottom: 100px; z-index: 30;
        display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
      }
      .fab {
        width: auto; margin: 0; display: flex; align-items: center; gap: 8px;
        padding: 12px 16px; border-radius: 999px; font-size: 14px; font-weight: 600;
        border: 1px solid var(--border); background: var(--panel); color: var(--text);
        backdrop-filter: blur(10px); box-shadow: 0 6px 24px rgba(0,0,0,0.4); cursor: pointer;
      }
      .fab.primary { background: var(--accent); color: #0b0d12; border-color: var(--accent); }
      .fab.mic.listening { background: #ff6b6b; color: #fff; border-color: #ff6b6b; animation: pulse 1.2s infinite; }
      @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,107,0.5); } 50% { box-shadow: 0 0 0 10px rgba(255,107,107,0); } }
      .fab:disabled { opacity: 0.4; cursor: not-allowed; }

      #exitAR {
        position: fixed; top: 16px; left: 16px; z-index: 40; display: none;
      }
      .voice-caption {
        position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%);
        max-width: min(560px, calc(100vw - 32px)); z-index: 25;
        font-size: 13px; color: var(--text); text-align: center;
        background: var(--panel); border: 1px solid var(--border);
        padding: 8px 14px; border-radius: 12px; display: none;
      }
      .voice-caption.show { display: block; }
      .voice-caption b { color: var(--accent); }

      /* Panel collapse toggle */
      #panelToggle {
        position: fixed; top: 16px; left: 16px; z-index: 25; width: auto; margin: 0;
        padding: 9px 12px; border-radius: 10px; display: none;
      }
      .panel.collapsed { display: none; }

      /* ---- AR mode: hide the dev chrome, show exit ---- */
      body.ar-active .panel,
      body.ar-active #panelToggle,
      body.ar-active .status,
      body.ar-active .fab.ar { display: none !important; }
      body.ar-active #exitAR { display: flex; }

      /* ---- Mobile ---- */
      @media (max-width: 720px) {
        .panel { display: none; }          /* hidden by default; gear toggles it */
        .panel.collapsed { display: none; }
        .panel:not(.collapsed).open { display: block; width: calc(100vw - 32px); max-width: 340px; }
        #panelToggle { display: block; }
        .modebar { top: 64px; gap: 4px; padding: 5px; max-width: calc(100vw - 24px); overflow-x: auto; }
        .modebtn { padding: 7px 9px; font-size: 12px; }
        .card { bottom: 96px; }
        .fab-cluster { bottom: 88px; }
        .fab { padding: 11px 14px; font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>

    <div class="panel">
      <h1>Exploded View</h1>
      <div class="sub" id="credit">…</div>

      <div class="field">
        <label>Model</label>
        <select id="model"></select>
      </div>

      <div class="field">
        <label>Split mode</label>
        <select id="mode">
          <option value="group">By material group</option>
          <option value="component">By connected piece</option>
        </select>
      </div>

      <div class="field">
        <label>Explode amount</label>
        <div class="row">
          <input type="range" id="explode" min="0" max="2" step="0.01" value="0" />
        </div>
        <div class="row"><span class="val" id="explodeVal">0.00</span></div>
      </div>

      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="tint" /> Tint parts by component</label>
        <label class="toggle"><input type="checkbox" id="wireframe" /> Wireframe</label>
        <label class="toggle"><input type="checkbox" id="autorotate" /> Auto-rotate</label>
      </div>

      <button id="reset">Reset view</button>

      <hr />

      <div class="stat"><span>Component parts</span><b id="partCount">–</b></div>
      <div class="legend" id="legend"></div>
    </div>

    <div class="modebar" id="modebar"></div>

    <div class="card" id="card">
      <div class="kicker" id="cardKicker">Fix</div>
      <div class="body" id="cardBody">…</div>
      <div class="meta" id="cardMeta"></div>
      <div class="chips" id="cardChips"></div>
      <div class="stepnav" id="cardNav">
        <button id="stepPrev">◀ Back</button>
        <button id="stepNext" class="primary">Next ▶</button>
      </div>
    </div>

    <button id="panelToggle">⚙︎ Controls</button>

    <div class="fab-cluster">
      <button class="fab ar primary" id="startAR">📱 View in AR</button>
      <button class="fab mic" id="micBtn">🎤 Ask</button>
    </div>

    <button class="fab" id="exitAR">✕ Exit AR</button>

    <div class="voice-caption" id="voiceCaption"></div>

    <div class="status" id="status">Initialising…</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
