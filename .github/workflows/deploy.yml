name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # These come from repo Settings → Secrets and variables → Actions.
          # NOTE: Vite bakes them into the public bundle — use restricted keys.
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_ID: ${{ secrets.VITE_ELEVENLABS_VOICE_ID }}
          VITE_ELEVENLABS_MODEL: ${{ secrets.VITE_ELEVENLABS_MODEL }}
          VITE_DGPT_BASE_URL: ${{ secrets.VITE_DGPT_BASE_URL }}
          VITE_DGPT_API_KEY: ${{ secrets.VITE_DGPT_API_KEY }}
          VITE_DGPT_MODEL: ${{ secrets.VITE_DGPT_MODEL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
