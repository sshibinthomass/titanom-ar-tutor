name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
        env:
          # These come from repo Settings → Secrets and variables → Actions.
          # NOTE: Vite bakes them into the public bundle — use restricted keys.
          VITE_ELEVENLABS_API_KEY: ${{ secrets.VITE_ELEVENLABS_API_KEY }}
          VITE_ELEVENLABS_VOICE_ID: ${{ secrets.VITE_ELEVENLABS_VOICE_ID }}
          VITE_ELEVENLABS_MODEL: ${{ secrets.VITE_ELEVENLABS_MODEL }}
          # Mic speech-to-text (primary); empty falls back to scribe_v2 in code.
          VITE_ELEVENLABS_STT_MODEL: ${{ secrets.VITE_ELEVENLABS_STT_MODEL }}
          # OpenAI is called browser-direct (it serves CORS), so the key alone
          # makes the deployed site work. Set VITE_OPENAI_BASE_URL to the
          # Worker instead if you'd rather the key stayed out of the bundle.
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
          VITE_OPENAI_BASE_URL: ${{ secrets.VITE_OPENAI_BASE_URL }}
          # Empty falls back to gpt-5.6-terra / gpt-5.6-sol / gpt-4o-transcribe.
          VITE_OPENAI_MODEL: ${{ secrets.VITE_OPENAI_MODEL }}
          VITE_OPENAI_PLAN_MODEL: ${{ secrets.VITE_OPENAI_PLAN_MODEL }}
          VITE_OPENAI_STT_MODEL: ${{ secrets.VITE_OPENAI_STT_MODEL }}
          # Only the Worker's /langfuse URL is bundled — the Langfuse keys
          # themselves live as Worker secrets, never in the client bundle.
          VITE_LANGFUSE_BASE_URL: ${{ secrets.VITE_LANGFUSE_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
